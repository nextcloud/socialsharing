version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
    open-pull-requests-limit: 10
  - package-ecosystem: composer
    directories:
      - "/socialsharing_bluesky/"
      - "/socialsharing_diaspora/"
      - "/socialsharing_email/"
      - "/socialsharing_facebook/"
      - "/socialsharing_telegram/"
      - "/socialsharing_twitter/"
      - "/socialsharing_whatsapp/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
      exclude:
        - "nextcloud/*"
    groups:
      composer:
        patterns:
          - "*"
        group-by: dependency-name
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directories:
      - "/socialsharing_bluesky/"
      - "/socialsharing_diaspora/"
      - "/socialsharing_email/"
      - "/socialsharing_facebook/"
      - "/socialsharing_telegram/"
      - "/socialsharing_twitter/"
      - "/socialsharing_whatsapp/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
      exclude:
        - "@nextcloud/*"
    groups:
      npm:
        patterns:
          - "*"
        group-by: dependency-name
    open-pull-requests-limit: 10
