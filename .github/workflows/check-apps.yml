name: Check app consistency

on: pull_request

permissions:
  contents: read

concurrency:
  group: check-apps-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-apps:
    runs-on: ubuntu-latest

    name: check-apps

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that all apps are consistent
        run: bash .github/scripts/check-apps.sh
